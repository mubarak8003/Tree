<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Solid brand electric purple background -->
  <rect width="512" height="512" fill="#4B00FF"/>
  
  <g>
    <!-- Bold white FTP text -->
    <text 
      x="256" 
      y="320" 
      text-anchor="middle" 
      fill="#FFFFFF" 
      font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" 
      font-weight="900" 
      font-size="220" 
      letter-spacing="-1"
    >FTP</text>
    
    <!-- White trending upward arrow under FTP -->
    <g stroke="#FFFFFF" stroke-width="26" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Zigzag line -->
      <path d="M 148 408 L 202 365 L 254 408 L 318 352" />
      <!-- Arrowhead at the end (318, 352) pointing top-right -->
      <path d="M 284 346 L 324 350 L 320 390" />
    </g>
  </g>
</svg>
